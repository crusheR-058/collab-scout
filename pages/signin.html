<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Collab Scout</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='10' fill='%232f4df5'/%3E%3Ccircle cx='20' cy='16' r='10' fill='%23ff4f7b' style='mix-blend-mode:multiply'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Martian+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/landing.css" />
  </head>
  <body class="landing signin-page">
    <main class="signin-card">
      <a class="mark" href="/"><span class="discs" aria-hidden="true"><i></i><i></i></span>Collab Scout</a>
      <h1>Sign in</h1>
      <p>Your scouts and plans, saved to your account on any device.</p>
      <p class="signin-problem" id="problem" role="alert" hidden></p>
      <div id="google" hidden>
        <a class="btn btn-line" href="/auth/google"><span class="google" aria-hidden="true"></span>Continue with Google</a>
        <div class="or">or</div>
      </div>
      <a class="btn btn-ink" href="/auth/signin">Continue with email</a>
      <p class="fine">New here? The same button creates your account. <a href="/">Back to the home page</a> · <a href="/privacy.html">Privacy</a></p>
    </main>
    <script type="module" src="/js/signin.js"></script>
  </body>
</html>
