<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>A shared brief · Collab Scout</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='10' fill='%232f4df5'/%3E%3Ccircle cx='20' cy='16' r='10' fill='%23ff4f7b' style='mix-blend-mode:multiply'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Martian+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-view="shared">
    <header class="top">
      <a class="mark" href="/" aria-label="Collab Scout, home page">
        <span class="mark-discs" aria-hidden="true"><i></i><i></i></span>
        Collab Scout
      </a>
      <p class="status"><span class="pill">Shared brief, read-only</span></p>
    </header>

    <main class="shared">
      <div class="panel ended" id="share-missing" hidden>
        <p class="eyebrow">Nothing to show</p>
        <h2 id="share-missing-text">Loading the brief.</h2>
        <a class="primary" href="/">Go to Collab Scout</a>
      </div>
      <article class="panel brief" id="panel-brief" hidden></article>
    </main>

    <footer class="foot">
      <p>
        Qloo describes audiences in aggregate. An overlap is a pattern across many people, not a
        prediction about any one person.
      </p>
    </footer>

    <script type="module" src="/js/share.js"></script>
  </body>
</html>
