<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Collab Scout is closed for the night</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1d0f4a;
        color: #fafafc;
        font: 17px/1.5 "Schibsted Grotesk", system-ui, sans-serif;
      }
      main { max-width: 32rem; padding: 2rem; }
      h1 { font: 700 2.6rem/1.1 "Big Shoulders Display", "Arial Narrow", sans-serif; margin: 0 0 1rem; }
      p { margin: 0 0 1rem; color: #d3d6e1; }
      strong { color: #ffd84d; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Collab Scout is closed for the night.</h1>
      <p>It is open every day from <strong>11:00 to 21:00 IST</strong>. Your saved scouts are safe and will be here when it opens.</p>
      <p>If it is within those hours, it may be restarting. Try again in a minute.</p>
    </main>
  </body>
